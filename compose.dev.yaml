# Independent local stack. Use .\dev.cmd so dev/.env is loaded explicitly.
name: wildpaws-dev

services:
  sql:
    # Match the deployed application's database major version.
    image: postgres:11-alpine
    environment:
      POSTGRES_DB: wildpaws_dev
      POSTGRES_USER: wildpaws_dev
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:?Run .\dev.cmd setup first}
    volumes:
      - dev-sql:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U wildpaws_dev -d wildpaws_dev]
      interval: 3s
      timeout: 3s
      retries: 30

  server:
    build:
      context: ./server
      target: release
    environment:
      POSTGRES_HOST: sql
      POSTGRES_DB: wildpaws_dev
      POSTGRES_USER: wildpaws_dev
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:?Run .\dev.cmd setup first}
      THREADS: "2"
    depends_on:
      sql:
        condition: service_healthy
    volumes:
      - dev-data:/data
      - ./dev/config.local.yaml:/opt/app/config.yaml:ro
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:6666/info', headers={'Accept': 'application/json'}), timeout=3)"
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 30
    develop:
      watch:
        - action: sync+restart
          path: ./server/szurubooru
          target: /opt/app/szurubooru
          ignore:
            - tests/
            - __pycache__/
            - "*.pyc"
        - action: rebuild
          path: ./server/Dockerfile
        - action: rebuild
          path: ./server/config.yaml.dist

  assets:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    environment:
      BASE_URL: /
      BUILD_INFO: local-dev
    volumes:
      - dev-assets:/opt/app/public
    # The existing client connects to port 8080 for live reload.
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: [CMD-SHELL, "test -s public/index.htm && test -s public/js/app.min.js && test -s public/js/vendor.min.js"]
      interval: 3s
      timeout: 3s
      start_period: 20s
      retries: 40
    develop:
      watch:
        - action: sync
          path: ./client
          target: /opt/app
          ignore:
            - node_modules/
            - public/
            - js/.config.autogen.json
            - js/.templates.autogen.js
            - package.json
            - package-lock.json
            - Dockerfile
            - Dockerfile.dev
        - action: rebuild
          path: ./client/package.json
        - action: rebuild
          path: ./client/package-lock.json
        - action: rebuild
          path: ./client/Dockerfile.dev

  client:
    image: nginx:alpine
    depends_on:
      server:
        condition: service_healthy
      assets:
        condition: service_healthy
    volumes:
      - ./dev/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - dev-assets:/var/www:ro
      - dev-data:/data:ro
    ports:
      - "127.0.0.1:${DEV_HTTP_PORT:-8088}:80"

  tests:
    profiles: [test]
    build:
      context: ./server
      target: testing
    # The repository's test image starts its own temporary PostgreSQL instance.
    # It has no connection to the development or production database volumes.

volumes:
  dev-sql:
  dev-data:
  dev-assets:
